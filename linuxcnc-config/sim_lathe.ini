[EMC]
VERSION = 1.1
MACHINE = GODOT-CNC-TRAINER-LATHE
DEBUG = 0

[DISPLAY]
DISPLAY = dummy
CYCLE_TIME = 0.050
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.5
MAX_SPINDLE_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
PROGRAM_PREFIX = ./nc_files
INTRO_GRAPHIC =
INTRO_TIME = 0

[FILTER]
PROGRAM_EXTENSION = .py Python Script
py = python3

[RS274NGC]
PARAMETER_FILE = sim_lathe.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 50000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALUI = halui
; -no_use_hal_manualtoolchange: the stock option wires LinuxCNC's own Tk
; ("hal_manualtoolchange") confirmation dialog, which needs a real X display we
; don't have (and don't want) in a headless bridge. Our own operator panel
; (Phase 4) drives iocontrol.0.tool-change / tool-changed directly instead.
HALFILE = LIB:basic_sim.tcl -no_use_hal_manualtoolchange

[TRAJ]
COORDINATES = X Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 20.0
MAX_LINEAR_VELOCITY = 100.0
DEFAULT_LINEAR_ACCELERATION = 400.0
MAX_LINEAR_ACCELERATION = 800.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = sim_lathe.tbl
TOOL_CHANGE_POSITION = 80 0 40
TOOL_CHANGE_WITH_SPINDLE_ON = 0

[KINS]
KINEMATICS = trivkins coordinates=xz
JOINTS = 2

; X is the cross-slide axis, modeled in RADIUS mode (matches the
; lathe.xml / Axis convention: positive X = tool moving away from
; the spindle centerline). 0 = on center, negative X means the tool
; has crossed the centerline (valid for facing/boring moves).
[AXIS_X]
MIN_LIMIT = -5.0
MAX_LIMIT = 150.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0
MIN_LIMIT = -5.0
MAX_LIMIT = 150.0
HOME_SEARCH_VEL = 20.0
HOME_LATCH_VEL = 5.0
HOME_SEQUENCE = 0

; Z runs along the spindle axis, headstock at Z=0 growing negative
; toward the chuck face / positive away from it, matching the stock
; LinuxCNC lathe convention (tool starts clear of the part at Z>0).
[AXIS_Z]
MIN_LIMIT = -300.0
MAX_LIMIT = 50.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0

[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0
MIN_LIMIT = -300.0
MAX_LIMIT = 50.0
HOME_SEARCH_VEL = 20.0
HOME_LATCH_VEL = 5.0
HOME_SEQUENCE = 1
