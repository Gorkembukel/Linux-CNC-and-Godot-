[EMC]
VERSION = 1.1
MACHINE = GODOT-CNC-TRAINER-MILL
DEBUG = 0

[DISPLAY]
DISPLAY = dummy
CYCLE_TIME = 0.050
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.5
MAX_SPINDLE_OVERRIDE = 1.2
MIN_SPINDLE_OVERRIDE = 0.5
PROGRAM_PREFIX = ./nc_files
INTRO_GRAPHIC =
INTRO_TIME = 0

[FILTER]
PROGRAM_EXTENSION = .py Python Script
py = python3

[RS274NGC]
PARAMETER_FILE = sim_mill.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 50000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALUI = halui
HALFILE = LIB:basic_sim.tcl -no_use_hal_manualtoolchange

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 20.0
MAX_LINEAR_VELOCITY = 100.0
DEFAULT_LINEAR_ACCELERATION = 400.0
MAX_LINEAR_ACCELERATION = 800.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = sim_mill.tbl
TOOL_CHANGE_WITH_SPINDLE_ON = 0

[KINS]
KINEMATICS = trivkins coordinates=xyz
JOINTS = 3

; Origin is the centre of the stock's top face: X/Y = 0 at the block's
; middle, Z = 0 on its uncut top surface, negative Z cuts into it.
[AXIS_X]
MIN_LIMIT = -150.0
MAX_LIMIT = 150.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0

[JOINT_0]
TYPE = LINEAR
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0
MIN_LIMIT = -150.0
MAX_LIMIT = 150.0
HOME_SEARCH_VEL = 20.0
HOME_LATCH_VEL = 5.0
HOME_SEQUENCE = 1

[AXIS_Y]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0

[JOINT_1]
TYPE = LINEAR
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
HOME_SEARCH_VEL = 20.0
HOME_LATCH_VEL = 5.0
HOME_SEQUENCE = 1

; Homes first and parks at Z=50, clear of the stock, before X/Y move.
[AXIS_Z]
MIN_LIMIT = -40.0
MAX_LIMIT = 120.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0

[JOINT_2]
TYPE = LINEAR
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 800.0
MIN_LIMIT = -40.0
MAX_LIMIT = 120.0
HOME = 50.0
HOME_SEARCH_VEL = 20.0
HOME_LATCH_VEL = 5.0
HOME_SEQUENCE = 0
